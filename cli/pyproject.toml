[project]
name = "digen-skill-cli"
version = "0.1.0"
description = "Digen user-side skill CLI — create, edit, and upload your own skills from the command line"
requires-python = ">=3.11"

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
digenskill = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
